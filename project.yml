name: WebRTCReconnectMock
options:
  bundleIdPrefix: com.aselder
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  # Shared WebRTC binary: pin exact to match client-sdk-swift (main) so SPM can unify.
  LiveKitWebRTC:
    url: https://github.com/livekit/webrtc-xcframework.git
    exactVersion: "150.7871.01"
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    branch: main
targets:
  WebRTCReconnectMock:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aselder.WebRTCReconnectMock
        PRODUCT_NAME: WebRTCReconnectMock
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Resources/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: WebRTC Reconnect Mock
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "X6SLU75GM8"
    dependencies:
      - package: LiveKitWebRTC
        product: LiveKitWebRTC
    scheme:
      testTargets: []
  LiveKitRoomDemo:
    type: application
    platform: iOS
    sources:
      - path: LiveKitRoomDemo/Sources
      - path: LiveKitRoomDemo/Resources
        buildPhase: resources
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aselder.LiveKitRoomDemo
        PRODUCT_NAME: LiveKitRoomDemo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: LiveKitRoomDemo/Resources/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: LiveKit Room Demo
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "X6SLU75GM8"
    dependencies:
      - package: LiveKit
        product: LiveKit
    scheme:
      testTargets: []
